[app]
name = "vscode"
version = "0.1.0"
description = "code-server (VS Code in the browser) packaged for OpenHost with one-click SSO. The zone owner is auto-logged-in to a full VS Code workspace without ever seeing code-server's native password prompt; persistent state lives under OPENHOST_APP_DATA_DIR so notebooks and extensions survive redeploys."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# Auth-proxy port.  code-server runs on 127.0.0.1:8082 inside the
# container; the proxy listens on 8080 and is what the OpenHost
# router forwards to.
port = 8080

[routing]
# code-server's /healthz returns {"status":"alive"} unauthenticated
# so the OpenHost router can ping it to determine "container up."
health_check = "/healthz"
# /healthz is the unauthenticated probe.  We do NOT list `/login`
# here even though the auth-proxy auto-logins via that endpoint —
# the proxy POSTs to it from inside the container directly to
# 127.0.0.1:8082, never through the OpenHost router, so it doesn't
# need to be a public path.
public_paths = ["/healthz"]

[resources]
# code-server is a Node-based VS Code server.  Memory grows with
# the size of the workspace + open files + extensions; 1 GiB is
# comfortable for a single owner with a normal-sized repo.
memory_mb = 1024
cpu_millicores = 1000

[data]
# Persistent state under /data/app_data/vscode/:
#   * config/      — code-server config (the password is here)
#   * data/        — VS Code's user data (extensions, settings,
#                    history, workspace state)
#   * workspace/   — the default working directory shown in the
#                    file tree (created empty on first boot)
#   * admin-credentials.txt — the auto-generated password used for
#                             auto-login (mode 0600)
app_data = true
app_temp_data = true
